name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint
        run: npm run lint

      - name: Check types and Svelte components
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
        env:
          BATTLE_NET_CLIENT_ID: ci-placeholder
          BATTLE_NET_CLIENT_SECRET: ci-placeholder
          TRIGGER_SECRET_KEY: ci-placeholder
          VERCEL_PROJECT_PRODUCTION_URL: example.invalid
